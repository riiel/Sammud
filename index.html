<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sammuring – Tee 10 000 sammu täis</title>
  <!-- Kasutame töökindlat Cloudflare CDN-i -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ülemine juhtpaneel */
    .panel {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 1000;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .title span { color: var(--accent); }

    .gps-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .gps-btn:active { transform: scale(0.97); }

    /* Sisendite rida */
    .inputs-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.8fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .input-group label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input, .input-group select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
    }

    .input-group input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    /* Statistika ja valikud */
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .stats-highlight { color: var(--accent); font-weight: 700; }

    .buffer-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
    }

    /* Tegevusnupud */
    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 8px;
    }

    select.dir-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .generate-btn {
      background: var(--accent);
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .generate-btn:hover { background: var(--accent-hover); }
    .generate-btn:disabled { opacity: 0.5; cursor: wait; }

    /* Kaardikonteiner kindla miinimumkõrgusega */
    #map {
      flex: 1 1 auto;
      width: 100%;
      min-height: 300px;
      background: #e2e8f0;
      z-index: 1;
    }

    /* Alumine tulemuse kaart */
    .result-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      z-index: 1000;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .result-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .result-main { font-size: 1rem; font-weight: 700; }
    .result-sub { font-size: 0.8rem; color: var(--muted); }

    .result-buttons {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
    }

    .next-btn {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .gmaps-btn {
      background: var(--blue);
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="header-row">
      <div class="title">👟 Sammu<span>ring</span></div>
      <button class="gps-btn" id="gpsBtn" onclick="locateUser()">📍 Minu asukoht</button>
    </div>

    <div class="inputs-grid">
      <div class="input-group">
        <label>Tehtud sammud</label>
        <input type="number" id="currentSteps" value="7733" inputmode="numeric" oninput="updateTargetStats()" />
      </div>
      <div class="input-group">
        <label>Päeva eesmärk</label>
        <input type="number" id="goalSteps" value="10000" inputmode="numeric" oninput="updateTargetStats()" />
      </div>
      <div class="input-group">
        <label>Samm (cm)</label>
        <input type="number" id="strideCm" value="76" inputmode="numeric" oninput="updateTargetStats()" />
      </div>
    </div>

    <div class="meta-row">
      <div id="targetSummary">Arvutan...</div>
      <label class="buffer-toggle">
        <input type="checkbox" id="bufferCheck" checked onchange="updateTargetStats()" />
        +5% varu
      </label>
    </div>

    <div class="actions-row">
      <select id="directionSelect" class="dir-select">
        <option value="random">🔄 Suvaline suund</option>
        <option value="0">⬆️ Põhja poole</option>
        <option value="90">➡️ Ida poole</option>
        <option value="180">⬇️ Lõuna poole</option>
        <option value="270">⬅️ Lääne poole</option>
      </select>
      <button class="generate-btn" id="genBtn" onclick="generateLoop()">
        ⚡ Joonista ring
      </button>
    </div>
  </div>

  <div id="map"></div>

  <div class="result-bar" id="resultBar">
    <div class="result-info">
      <div>
        <div class="result-main" id="resSteps">+0 sammu</div>
        <div class="result-sub" id="resTotal">Kokku: 0 sammu</div>
      </div>
    </div>
    <div class="result-buttons">
      <button class="next-btn" onclick="rotateAndGenerate()">🎲 Proovi teist</button>
      <a href="#" target="_blank" class="gmaps-btn" id="gmapsLink">🗺️ Ava Google Mapsis</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // Laeme salvestatud asukoha või kasutame vaikimisi Pärnu kesklinna
    const savedLat = parseFloat(localStorage.getItem('sr_lat')) || 58.3859;
    const savedLon = parseFloat(localStorage.getItem('sr_lon')) || 24.4971;
    let startCoords = { lat: savedLat, lon: savedLon };

    // Laeme salvestatud seaded
    if (localStorage.getItem('sr_goal')) document.getElementById('goalSteps').value = localStorage.getItem('sr_goal');
    if (localStorage.getItem('sr_stride')) document.getElementById('strideCm').value = localStorage.getItem('sr_stride');

    let currentBearing = Math.floor(Math.random() * 360);
    let targetMeters = 1800;

    // Initsialiseerime kaardi otse OpenStreetMapi ametliku kihiga
    const map = L.map('map', { zoomControl: false }).setView([startCoords.lat, startCoords.lon], 14);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Lohistatav alguspunkti marker
    const startMarker = L.marker([startCoords.lat, startCoords.lon], { draggable: true }).addTo(map);

    // Sunnime kaardi suurust uuesti arvutama, et vältida tühi-ekraani viga
    window.addEventListener('load', () => {
      setTimeout(() => {
        map.invalidateSize();
        startMarker.bindPopup("<b>Algus ja lõpp</b><br>Kliki kaardile või vajuta 'Minu asukoht'").openPopup();
      }, 200);
    });
    window.addEventListener('resize', () => map.invalidateSize());

    let routeLayer = null;
    let waypointMarkers = [];

    map.on('click', (e) => {
      setStartPoint(e.latlng.lat, e.latlng.lng);
    });

    startMarker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      setStartPoint(pos.lat, pos.lng);
    });

    function setStartPoint(lat, lon) {
      startCoords = { lat, lon };
      startMarker.setLatLng([lat, lon]);
      localStorage.setItem('sr_lat', lat);
      localStorage.setItem('sr_lon', lon);
    }

    function locateUser() {
      const btn = document.getElementById('gpsBtn');
      if (!navigator.geolocation) {
        alert("Sinu brauser ei toeta GPS-i.");
        return;
      }
      btn.textContent = "⏳ Otsin...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          btn.textContent = "📍 Minu asukoht";
          setStartPoint(pos.coords.latitude, pos.coords.longitude);
          map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        },
        () => {
          btn.textContent = "📍 Minu asukoht";
          alert("Ei saanud GPS asukohta kätte. Luba brauseril asukohta kasutada või kliki otse kaardile!");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function updateTargetStats() {
      const current = parseInt(document.getElementById('currentSteps').value) || 0;
      const goal = parseInt(document.getElementById('goalSteps').value) || 10000;
      const strideCm = parseInt(document.getElementById('strideCm').value) || 76;
      const addBuffer = document.getElementById('bufferCheck').checked;

      localStorage.setItem('sr_goal', goal);
      localStorage.setItem('sr_stride', strideCm);

      let missingSteps = Math.max(0, goal - current);
      if (addBuffer && missingSteps > 0) {
        missingSteps = Math.round(missingSteps * 1.05);
      }

      targetMeters = Math.round(missingSteps * (strideCm / 100));
      const km = (targetMeters / 1000).toFixed(2);
      const mins = Math.round(targetMeters / 80);

      const summaryEl = document.getElementById('targetSummary');
      if (missingSteps === 0) {
        summaryEl.innerHTML = `<span class="stats-highlight">🎉 Sammud on juba täis!</span>`;
      } else {
        summaryEl.innerHTML = `Vaja: <span class="stats-highlight">${missingSteps} sammu</span> (~${km} km / ${mins} min)`;
      }
    }

    function offsetCoord(lat, lon, distanceMeters, bearingDeg) {
      const rad = bearingDeg * (Math.PI / 180);
      const dLat = (distanceMeters * Math.cos(rad)) / 111320;
      const dLon = (distanceMeters * Math.sin(rad)) / (111320 * Math.cos(lat * (Math.PI / 180)));
      return { lat: lat + dLat, lon: lon + dLon };
    }

    async function fetchFootRoute(points) {
      const coordString = points.map(p => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
      const urls = [
        `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${coordString}?overview=full&geometries=geojson`,
        `https://router.project-osrm.org/route/v1/foot/${coordString}?overview=full&geometries=geojson`
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data.routes && data.routes.length > 0) return data;
          }
        } catch (e) {}
      }
      throw new Error("Marsruudiserveriga ei õnnestunud ühendust saada.");
    }

    function rotateAndGenerate() {
      document.getElementById('directionSelect').value = 'random';
      currentBearing = (currentBearing + 75) % 360;
      generateLoop(true);
    }

    async function generateLoop(keepBearing = false) {
      if (targetMeters < 150) {
        alert("Puuduolev distants on liiga väike – tee paar tiiru ümber toa!");
        return;
      }

      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.textContent = "⏳ Arvutan...";

      try {
        const dirVal = document.getElementById('directionSelect').value;
        if (dirVal !== 'random') {
          currentBearing = parseInt(dirVal);
        } else if (!keepBearing) {
          currentBearing = Math.floor(Math.random() * 360);
        }

        let radius = targetMeters / 6.8;
        let routeData = null;

        for (let attempt = 0; attempt < 2; attempt++) {
          const center = offsetCoord(startCoords.lat, startCoords.lon, radius, currentBearing);
          const p1 = offsetCoord(center.lat, center.lon, radius, currentBearing - 90);
          const p2 = offsetCoord(center.lat, center.lon, radius, currentBearing);
          const p3 = offsetCoord(center.lat, center.lon, radius, currentBearing + 90);

          routeData = await fetchFootRoute([startCoords, p1, p2, p3, startCoords]);
          const actualDist = routeData.routes[0].distance;

          const errorRatio = Math.abs(actualDist - targetMeters) / targetMeters;
          if (errorRatio <= 0.12 || actualDist === 0) break;
          radius = radius * (targetMeters / actualDist);
        }

        renderRoute(routeData);
      } catch (err) {
        alert("Viga teekonna arvutamisel: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "⚡ Joonista ring";
      }
    }

    function renderRoute(data) {
      const route = data.routes[0];
      const waypoints = data.waypoints;

      if (routeLayer) map.removeLayer(routeLayer);
      waypointMarkers.forEach(m => map.removeLayer(m));
      waypointMarkers = [];

      routeLayer = L.geoJSON(route.geometry, {
        style: { color: '#059669', weight: 6, opacity: 0.9 }
      }).addTo(map);

      [1, 2, 3].forEach((idx) => {
        const
