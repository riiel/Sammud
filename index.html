<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sammuring</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #f8fafc; }

  #map { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; background: #0b0f19; }

  #map.g-dark .leaflet-tile-pane {
    filter: invert(92%) hue-rotate(185deg) saturate(60%) brightness(92%) contrast(96%);
  }
  #map.g-light .leaflet-tile-pane,
  #map.g-sat .leaflet-tile-pane,
  #map.g-terrain .leaflet-tile-pane {
    filter: none;
  }

  .glass-top {
    position: fixed; top: 10px; left: 10px; right: 10px; z-index: 500;
    background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 20px;
    padding: 11px 13px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    max-height: 88vh; overflow-y: auto;
  }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .brand { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 6px; }
  .brand span { color: #10b981; }
  .top-actions { display: flex; gap: 6px; }

  .pill-btn {
    background: rgba(51, 65, 85, 0.8); color: #f8fafc; border: 1px solid rgba(255,255,255,0.14);
    padding: 6px 10px; border-radius: 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer; width: auto;
  }
  .pill-btn:active { transform: scale(0.96); }

  .inputs { display: grid; grid-template-columns: 1.2fr 1.1fr 0.8fr; gap: 6px; margin-bottom: 7px; }
  .field { background: rgba(9, 13, 22, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 11px; padding: 4px 8px; }
  .field label { display: block; font-size: 0.62rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
  .field input { width: 100%; background: transparent; border: none; color: #fff; font-size: 0.92rem; font-weight: 800; outline: none; }

  .status-line { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 7px; padding: 0 2px; }
  .status-line b { color: #10b981; }

  .stops-bar { display: flex; gap: 6px; margin-bottom: 6px; }
  .stop-toggle {
    flex: 1; padding: 7px 10px; border-radius: 11px; font-size: 0.8rem; font-weight: 800;
    border: 1px dashed rgba(245, 158, 11, 0.6); background: rgba(245, 158, 11, 0.12);
    color: #fbbf24; cursor: pointer; text-align: center;
  }
  .stop-toggle.active { background: #f59e0b; color: #0b0f19; border-style: solid; box-shadow: 0 0 14px rgba(245, 158, 11, 0.4); }
  .clear-stops {
    padding: 7px 10px; border-radius: 11px; font-size: 0.78rem; font-weight: 800;
    background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5; cursor: pointer; display: none;
  }

  #stopsPanel { display: none; background: rgba(9, 13, 22, 0.65); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px; margin-bottom: 7px; }
  .stop-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .stop-item:last-child { border-bottom: none; }
  .stop-actions-btns { display: flex; gap: 4px; }
  .stop-action-btn { background: #334155; color: #fff; border: none; padding: 2px 7px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
  
  .bag-toggle-row { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; color: #cbd5e1; margin-top: 6px; cursor: pointer; font-weight: 600; line-height: 1.25; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  select {
    width: 100%; background: rgba(9, 13, 22, 0.8); color: #fff;
    border: 1px solid rgba(255,255,255,0.12); padding: 7px 9px; border-radius: 11px;
    font-size: 0.82rem; font-weight: 700; outline: none;
  }

  .main-btn {
    width: 100%; padding: 10px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #10b981, #059669); color: #042f1e;
    font-size: 0.92rem; font-weight: 800; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
  }
  .main-btn:disabled { opacity: 0.5; }

  #bar {
    position: fixed; bottom: 14px; left: 10px; right: 10px; z-index: 500; display: none;
    background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(16, 185, 129, 0.45); border-radius: 20px;
    padding: 13px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65);
  }
  .bar-btns { display: flex; gap: 6px; margin-top: 9px; }
  .b-btn { padding: 10px 8px; border-radius: 11px; font-weight: 800; font-size: 0.82rem; border: none; cursor: pointer; text-align: center; text-decoration: none; }
  .retry { background: rgba(51, 65, 85, 0.85); color: #fff; flex: 0.95; }
  .walk-btn { background: #10b981; color: #042f1e; flex: 1.3; }
  .gm { background: #3b82f6; color: #fff; flex: 1.05; }

  .start-pin {
    width: 22px; height: 22px; border-radius: 50%; background: #10b981;
    border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.35), 0 4px 10px rgba(0,0,0,0.5);
  }
  .stop-pin {
    background: #ef4444; color: #fff; border: 2px solid #fff; border-radius: 50%;
    font-weight: 900; font-size: 11px; text-align: center; line-height: 22px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.6);
  }
  .num-icon {
    background: #0f172a; color: #10b981; border: 2px solid #10b981; border-radius: 50%;
    font-weight: 800; font-size: 11px; text-align: center; line-height: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="glass-top">
  <div class="top-bar">
    <div class="brand">👟 Sammu<span>ring</span></div>
    <div class="top-actions">
      <button class="pill-btn" id="styleBtn" onclick="cycleStyle()">☀️ Hele</button>
      <button class="pill-btn" onclick="gps()">📍 Asukoht</button>
    </div>
  </div>

  <div class="inputs">
    <div class="field"><label>Tehtud</label><input type="number" id="cur" value="7733" oninput="calc()"></div>
    <div class="field"><label>Eesmärk</label><input type="number" id="goal" value="10000" oninput="calc()"></div>
    <div class="field"><label>Samm cm</label><input type="number" id="str" value="76" oninput="calc()"></div>
  </div>

  <div class="status-line" id="info">Vaja (+5% varuga): <b>2380 sammu</b> (~1.81 km)</div>

  <div class="stops-bar">
    <button class="stop-toggle" id="addStopBtn" onclick="toggleStopMode()">➕ Lisa peatus (0)</button>
    <button class="clear-stops" id="clearStopsBtn" onclick="clearStops()">🗑️ Nulli</button>
  </div>

  <div id="stopsPanel">
    <div id="stopsList"></div>
    <label class="bag-toggle-row">
      <input type="checkbox" id="directHomeCheck" checked>
      <span>🛍️ <b>Pood viimaseks:</b> tee sammuring enne viimast peatust ja tule sealt otse koju</span>
    </label>
  </div>

  <div class="controls">
    <select id="mode">
      <option value="loop">🔄 Puhas ring</option>
      <option value="outback">↔️ Edasi-tagasi</option>
    </select>
    <select id="dir">
      <option value="r">🎲 Suvaline suund</option>
      <option value="0">⬆️ Põhja</option>
      <option value="45">↗️ Kirdesse</option>
      <option value="90">➡️ Itta</option>
      <option value="135">↘️ Kagusse</option>
      <option value="180">⬇️ Lõunasse</option>
      <option value="225">↙️ Edelasse</option>
      <option value="270">⬅️ Läände</option>
      <option value="315">↖️ Loodesse</option>
    </select>
  </div>

  <button class="main-btn" id="b" onclick="go()">⚡ Joonista teekond</button>
</div>

<div id="map" class="g-light"></div>

<div id="bar">
  <div id="res" style="font-weight:800;font-size:0.98rem;"></div>
  <div id="sub" style="font-size:0.78rem;color:#94a3b8;margin-top:2px;"></div>
  <div class="bar-btns">
    <button class="b-btn retry" onclick="nextDir()">🎲 Uus kaar</button>
    <button class="b-btn walk-btn" id="walkBtn" onclick="toggleWalk()">🧭 Kõnni kaardil</button>
    <a id="gm" class="b-btn gm" target="_blank">🗺️ Maps</a>
  </div>
</div>

<script>
let pos = [58.3725, 24.5515], distM = 1809, ang = 45;
let glowLayer, layer, extraMks = [];
let stops = [], stopMks = [], addingStops = false;
let watchId = null, liveDot = null, liveCircle = null;
if (localStorage.sr_lat) pos = [Number(localStorage.sr_lat), Number(localStorage.sr_lon)];

const mapEl = document.getElementById('map');
const map = L.map('map', { zoomControl: false }).setView(pos, 15);

const styles = [
  { name: "☀️ Hele", cls: "g-light", url: "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&scale=2" },
  { name: "🌙 Tume", cls: "g-dark", url: "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&scale=2" },
  { name: "🛰️ Hübriid", cls: "g-sat", url: "https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&scale=2" },
  { name: "🏔️ Maastik", cls: "g-terrain", url: "https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}&scale=2" }
];

let styleIdx = Number(localStorage.sr_style) || 0;
if (styleIdx >= styles.length) styleIdx = 0;
let tileLayer = L.tileLayer(styles[styleIdx].url, { maxZoom: 20 }).addTo(map);
applyTheme();

function applyTheme() {
  const s = styles[styleIdx];
  mapEl.className = "leaflet-container leaflet-touch leaflet-fade-anim leaflet-grab leaflet-touch-drag leaflet-touch-zoom " + s.cls;
  document.getElementById('styleBtn').innerText = s.name;
}

function cycleStyle() {
  const prevUrl = styles[styleIdx].url;
  styleIdx = (styleIdx + 1) % styles.length;
  localStorage.sr_style = styleIdx;
  if (styles[styleIdx].url !== prevUrl) {
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(styles[styleIdx].url, { maxZoom: 20 }).addTo(map);
  }
  applyTheme();
}

const pinIcon = L.divIcon({ className: '', html: '<div class="start-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
const mk = L.marker(pos, { draggable: true, icon: pinIcon }).addTo(map);

function setPos(lat, lon) {
  pos = [lat, lon]; mk.setLatLng(pos);
  localStorage.sr_lat = lat; localStorage.sr_lon = lon;
}

map.on('click', e => {
  if (addingStops) addStop(e.latlng.lat, e.latlng.lng);
  else setPos(e.latlng.lat, e.latlng.lng);
});
mk.on('dragend', e => { let p = e.target.getLatLng(); setPos(p.lat, p.lng); });

function toggleStopMode() {
  addingStops = !addingStops;
  updateStopUI();
}

function addStop(lat, lon) {
  stops.push([lat, lon]);
  renderStops();
}

function clearStops() {
  stops = [];
  addingStops = false;
  renderStops();
}

function moveStop(idx, dir) {
  let newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= stops.length) return;
  let temp = stops[idx];
  stops[idx] = stops[newIdx];
  stops[newIdx] = temp;
  renderStops();
}

function removeStop(idx) {
  stops.splice(idx, 1);
  renderStops();
}

function renderStops() {
  stopMks.forEach(m => map.removeLayer(m));
  stopMks = [];
  
  let listHtml = "";
  stops.forEach((s, idx) => {
    const ic = L.divIcon({ className: 'stop-pin', html: `P${idx + 1}`, iconSize: [26, 26], iconAnchor: [13, 13] });
    const m = L.marker(s, { draggable: true, icon: ic }).addTo(map);
    m.on('dragend', e => {
      const p = e.target.getLatLng();
      stops[idx] = [p.lat, p.lng];
    });
    stopMks.push(m);

    let roleTxt = (idx === stops.length - 1) ? "Viimane peatus" : `${idx + 1}. peatus`;
    listHtml += `
      <div class="stop-item">
        <span><b>P${idx + 1}</b> (${roleTxt})</span>
        <div class="stop-actions-btns">
          <button class="stop-action-btn" onclick="moveStop(${idx}, -1)">⬆️</button>
          <button class="stop-action-btn" onclick="moveStop(${idx}, 1)">⬇️</button>
          <button class="stop-action-btn" style="background:#ef4444;" onclick="removeStop(${idx})">✕</button>
        </div>
      </div>
    `;
  });

  document.getElementById('stopsList').innerHTML = listHtml;
  document.getElementById('stopsPanel').style.display = stops.length > 0 ? "block" : "none";
  updateStopUI();
}

function updateStopUI() {
  const btn = document.getElementById('addStopBtn');
  const clr = document.getElementById('clearStopsBtn');
  if (addingStops) {
    btn.className = "stop-toggle active";
    btn.innerText = `📍 Kliki kaarti, et lisada! (${stops.length})`;
  } else {
    btn.className = "stop-toggle";
    btn.innerText = `➕ Lisa peatus (${stops.length})`;
  }
  clr.style.display = stops.length > 0 ? "block" : "none";
}

function calc() {
  let miss = Math.max(0, (goal.value - cur.value) * 1.05);
  distM = Math.round(miss * (str.value / 100));
  info.innerHTML = `Vaja (+5% varuga): <b>${Math.round(miss)} sammu</b> <span>(~${(distM/1000).toFixed(2)} km)</span>`;
}

function gps() {
  navigator.geolocation.getCurrentPosition(p => {
    setPos(p.coords.latitude, p.coords.longitude);
    map.setView(pos, 16);
  }, () => alert("GPS ei vastanud!"));
}

function toggleWalk() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    if (liveDot) map.removeLayer(liveDot);
    if (liveCircle) map.removeLayer(liveCircle);
    walkBtn.innerText = "🧭 Kõnni kaardil"; walkBtn.style.background = "#10b981";
    return;
  }
  walkBtn.innerText = "⏹️ Lõpeta"; walkBtn.style.background = "#f59e0b";
  watchId = navigator.geolocation.watchPosition(p => {
    let c = [p.coords.latitude, p.coords.longitude];
    if (!liveDot) {
      liveCircle = L.circle(c, { radius: p.coords.accuracy || 15, color: '#3b82f6', fillOpacity: 0.2, weight: 1 }).addTo(map);
      liveDot = L.circleMarker(c, { radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
    } else {
      liveDot.setLatLng(c); liveCircle.setLatLng(c).setRadius(p.coords.accuracy || 15);
    }
    map.panTo(c);
  }, () => alert("GPS signaal puudub!"), { enableHighAccuracy: true });
}

function pt(lat, lon, d, a) {
  let r = a * Math.PI / 180;
  return [lat + (d * Math.cos(r)) / 111320, lon + (d * Math.sin(r)) / (111320 * Math.cos(lat * Math.PI / 180))];
}

function mDist(a, b) {
  let toR = Math.PI / 180, dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
  return Math.hypot(dLat, dLon * Math.cos((a[0] + b[0]) * 0.5 * toR)) * 6371000;
}

function pathLen(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += mDist(pts[i - 1], pts[i]);
  return s;
}

function cleanSpikes(rawCoords) {
  let pts = [rawCoords[0]];
  for (let i = 1; i < rawCoords.length; i++) {
    let d = mDist(rawCoords[i - 1], rawCoords[i]);
    if (d > 8) {
      let n = Math.ceil(d / 8);
      for (let k = 1; k < n; k++) {
        let f = k / n;
        pts.push([rawCoords[i - 1][0] + (rawCoords[i][0] - rawCoords[i - 1][0]) * f, rawCoords[i - 1][1] + (rawCoords[i][1] - rawCoords[i - 1][1]) * f]);
      }
    }
    pts.push(rawCoords[i]);
  }
  let changed = true, guard = 0;
  while (changed && guard++ < 35) {
    changed = false;
    let cum = [0];
    for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + mDist(pts[i - 1], pts[i]);
    let tot = cum[pts.length - 1];
    for (let i = 0; i < pts.length - 4 && !changed; i++) {
      for (let j = pts.length - 1; j > i + 3; j--) {
        if (cum[i] < 45 && (tot - cum[j]) < 45) continue;
        let sub = cum[j] - cum[i], direct = mDist(pts[i], pts[j]);
        if (sub > 25 && sub < tot * 0.65 && direct < 32 && sub > direct * 2.3) {
          pts.splice(i + 1, j - i); changed = true; break;
        }
      }
    }
  }
  return pts;
}

function sampleByDist(pts, count) {
  if (pts.length < 2) return pts;
  let cum = [0];
  for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + mDist(pts[i - 1], pts[i]);
  let tot = cum[cum.length - 1], res = [];
  for (let k = 1; k <= count; k++) {
    let target = (tot * k) / (count + 1);
    let idx = cum.findIndex(c => c >= target);
    if (idx !== -1) res.push(pts[idx]);
  }
  return res;
}

async function askOsrm(pts) {
  let s = pts.map(x => `${x[1].toFixed(5)},${x[0].toFixed(5)}`).join(';');
  let r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${s}?overview=full&geometries=geojson`);
  let d = await r.json();
  if (!d.routes || !d.routes[0]) throw new Error("Teekonda ei leitud");
  return d;
}

// Ehitab kahe punkti (fromPt -> toPt) vahele täpselt targetLegM pikkuse puhta kaare suunas baseAng
async function buildDetourLeg(fromPt, toPt, targetLegM, baseAng) {
  let mid = [(fromPt[0] + toPt[0]) / 2, (fromPt[1] + toPt[1]) / 2];
  let rad = Math.max(120, targetLegM / 3.1);
  let bestClean = [], bestLen = 0;

  for (let attempt = 0; attempt < 4; attempt++) {
    let p1 = pt(mid[0], mid[1], rad * 0.78, baseAng - 38);
    let p2 = pt(mid[0], mid[1], rad, baseAng);
    let p3 = pt(mid[0], mid[1], rad * 0.78, baseAng + 38);
    let d = await askOsrm([fromPt, p1, p2, p3, toPt]);
    let raw = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    bestClean = cleanSpikes(raw);
    bestLen = pathLen(bestClean);

    if (Math.abs(bestLen - targetLegM) / targetLegM <= 0.12) break;
    let ratio = targetLegM / Math.max(bestLen, 100);
    rad = rad * Math.min(2.4, Math.max(0.4, ratio));
  }
  return { coords: bestClean, dist: bestLen };
}

function drawGlowingRoute(coords) {
  if (glowLayer) map.removeLayer(glowLayer);
  if (layer) map.removeLayer(layer);
  glowLayer = L.polyline(coords, { color: '#10b981', weight: 14, opacity: 0.3 }).addTo(map);
  layer = L.polyline(coords, { color: '#059669', weight: 6, opacity: 1 }).addTo(map);
  map.fitBounds(layer.getBounds(), { paddingTopLeft: [20, 250], paddingBottomRight: [20, 125] });
}

function addDirectionNumbers(coords) {
  sampleByDist(coords, 3).forEach((p, idx) => {
    let ic = L.divIcon({ className: 'num-icon', html: `${idx + 1}`, iconSize: [22, 22] });
    extraMks.push(L.marker(p, { icon: ic }).addTo(map));
  });
}

function nextDir() {
  dir.value = 'r';
  ang = (ang + 55) % 360;
  go(true);
}

async function go(keepAng = false) {
  addingStops = false;
  updateStopUI();
  b.disabled = true; b.innerText = "⏳ Arvutan teekonda...";
  extraMks.forEach(m => map.removeLayer(m)); extraMks = [];

  try {
    if (!keepAng) {
      ang = dir.value === 'r' ? (ang + 55) % 360 : Number(dir.value);
    }

    // 1. KUI ON LISATUD PEATUSED (nt pood / sõber)
    if (stops.length > 0) {
      let shopLast = document.getElementById('directHomeCheck').checked;
      let lastStop = stops[stops.length - 1];

      // Mõõdame otsetee läbi peatuste ja viimasest peatusest otse koju
      let dDirectHome = await askOsrm([lastStop, pos]);
      let directHomeCoords = dDirectHome.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      let directHomeDist = dDirectHome.routes[0].distance;

      let fullRoute = [], totalD = 0, modeText = "", allWps = [];

      if (shopLast) {
        // POOD VIIMASEKS: Kõigepealt käime eelnevad peatused (kui on), siis teeme SUURE KAARE enne viimast peatust (poodi), ja poest tuleme OTSE KOJU!
        let prePoints = [pos, ...stops.slice(0, -1)];
        let preCoords = [pos], preDist = 0;
        if (prePoints.length > 1) {
          let dPre = await askOsrm(prePoints);
          preCoords = dPre.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          preDist = dPre.routes[0].distance;
        }
        let detourStart = prePoints[prePoints.length - 1];
        let dStraightToShop = await askOsrm([detourStart, lastStop]);
        let minPossible = preDist + dStraightToShop.routes[0].distance + directHomeDist;

        let legToShopCoords = dStraightToShop.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        let legToShopDist = dStraightToShop.routes[0].distance;

        if (minPossible < distM * 0.92) {
          let neededBeforeShop = distM - preDist - directHomeDist;
          let detour = await buildDetourLeg(detourStart, lastStop, neededBeforeShop, ang);
          legToShopCoords = detour.coords;
          legToShopDist = detour.dist;
        }

        fullRoute = [...preCoords, ...legToShopCoords.slice(1), ...directHomeCoords.slice(1)];
        totalD = preDist + legToShopDist + directHomeDist;
        modeText = "Kõigepealt sammuring → lõpus P" + stops.length + " → otse koju";

        let detourSamples = sampleByDist(legToShopCoords, 3);
        allWps = [...stops.slice(0, -1), ...detourSamples, lastStop].map(p => `${p[0].toFixed(5)},${p[1].toFixed(5)}`).join('|');
      } else {
        // POOD KOHE ALGUSES: Läheme otse läbi peatuste ja teeme SUURE KAARE tagasiteel koju!
        let dFixed = await askOsrm([pos, ...stops]);
        let fixedCoords = dFixed.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        let fixedDist = dFixed.routes[0].distance;

        let returnCoords = directHomeCoords;
        let returnDist = directHomeDist;

        if ((fixedDist + directHomeDist) < distM * 0.92) {
          let neededReturn = distM - fixedDist;
          let detour = await buildDetourLeg(lastStop, pos, neededReturn, ang);
          returnCoords = detour.coords;
          returnDist = detour.dist;
        }

        fullRoute = [...fixedCoords, ...returnCoords.slice(1)];
        totalD = fixedDist + returnDist;
        modeText = "Otse läbi peatuste → sammuring tagasiteel koju";

        let retSamples = sampleByDist(returnCoords, 3);
        allWps = [...stops, ...retSamples].map(p => `${p[0].toFixed(5)},${p[1].toFixed(5)}`).join('|');
      }

      drawGlowingRoute(fullRoute);
      addDirectionNumbers(fullRoute);

      let steps = Math.round(totalD / (str.value / 100));
      res.innerText = `${stops.length} peatusega: +${steps} sammu (${(totalD/1000).toFixed(2)} km)`;
      sub.innerText = `${modeText} • ~${Math.round(totalD/80)} min`;
      gm.href = `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${pos[0]},${pos[1]}&waypoints=${allWps}&travelmode=walking`;
    }

    // 2. TAVALINE EDASI-TAGASI (ilma peatusteta)
    else if (mode.value === 'outback') {
      let half = (distM / 2) * 0.8, d, turnPt;
      for (let i = 0; i < 3; i++) {
        let target = pt(pos[0], pos[1], half, ang);
        d = await askOsrm([pos, target, pos]);
        turnPt = [d.waypoints[1].location[1], d.waypoints[1].location[0]];
        let realD = d.routes[0].distance;
        if (Math.abs(realD - distM) / distM < 0.1) break;
        half = half * (distM / (realD || distM));
      }
      let coords = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      drawGlowingRoute(coords);
      extraMks.push(L.circleMarker(turnPt, { radius: 8, fillColor: '#f59e0b', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map));

      let totalD = d.routes[0].distance, steps = Math.round(totalD / (str.value / 100));
      res.innerText = `Edasi-tagasi: +${steps} sammu (${(totalD/1000).toFixed(2)} km)`;
      sub.innerText = `Pöördepunkt ${(totalD/2000).toFixed(2)} km kaugusel • ~${Math.round(totalD/80)} min`;
      gm.href = `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${pos[0]},${pos[1]}&waypoints=${turnPt[0]},${turnPt[1]}&travelmode=walking`;
    }

    // 3. TAVALINE PUHAS RING (ilma peatusteta)
    else {
      let detour = await buildDetourLeg(pos, pos, distM, ang);
      let clean = detour.coords, bestLen = detour.dist;

      drawGlowingRoute(clean);
      addDirectionNumbers(clean);

      let steps = Math.round(bestLen / (str.value / 100));
      res.innerText = `Puhas ring: +${steps} sammu (${(bestLen/1000).toFixed(2)} km)`;
      sub.innerText = `Järgi numbreid 1 → 2 → 3 • ~${Math.round(bestLen/80)} min kõndi`;
      let wps = sampleByDist(clean, 7).map(p => `${p[0].toFixed(5)},${p[1].toFixed(5)}`).join('|');
      gm.href = `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${pos[0]},${pos[1]}&waypoints=${wps}&travelmode=walking`;
    }
    bar.style.display = 'block';
  } catch (e) { alert("Viga: " + e.message); }
  b.disabled = false; b.innerText = "⚡ Joonista teekond";
}

calc();
</script>
