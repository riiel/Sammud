<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sammuring</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #0f172a; color: #fff; }
  .p { padding: 12px; background: #1e293b; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  input, select, button { padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-weight: bold; width: 100%; }
  .btn { background: #10b981; color: #000; border: none; cursor: pointer; }
  #map { width: 100%; height: 65vh; min-height: 340px; background: #334155; }
  #bar { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #1e293b; padding: 12px; border-radius: 10px; z-index: 999; display: none; border: 1px solid #10b981; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .gm { display: block; text-align: center; background: #3b82f6; color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; margin-top: 8px; font-weight: bold; }
  .hint { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="p">
  <div class="row">
    <b>👟 Sammuring</b>
    <button onclick="gps()" style="width:auto;background:#334155;">📍 Minu asukoht</button>
  </div>
  <div class="row">
    <input type="number" id="cur" value="7733" oninput="calc()" placeholder="Tehtud">
    <input type="number" id="goal" value="10000" oninput="calc()" placeholder="Eesmärk">
    <input type="number" id="str" value="76" oninput="calc()" style="width:75px" placeholder="cm">
  </div>
  <div class="hint">💡 Lohista sinist pinni kaardil või kliki uude kohta!</div>
  <div class="row" style="font-size:14px;color:#10b981;" id="info">Vaja: 2380 sammu (~1.81 km)</div>
  <div class="row">
    <select id="dir">
      <option value="r">🔄 Suvaline suund</option>
      <option value="0">⬆️ Põhja</option>
      <option value="90">➡️ Itta</option>
      <option value="180">⬇️ Lõunasse</option>
      <option value="270">⬅️ Läände</option>
    </select>
    <button class="btn" id="b" onclick="go()">⚡ Joonista ring</button>
  </div>
</div>

<div id="map"></div>
<div id="bar"><div id="res"></div><a id="gm" class="gm" target="_blank">🗺️ Ava Google Mapsis</a></div>

<script>
let pos = [61.168, 25.545], distM = 1809, ang = 45, layer;
const map = L.map('map').setView(pos, 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const mk = L.marker(pos, { draggable: true }).addTo(map)
  .bindPopup("<b>Alguspunkt</b><br>Lohista mind soovitavasse kohta!").openPopup();

map.on('click', e => {
  pos = [e.latlng.lat, e.latlng.lng];
  mk.setLatLng(pos);
});

mk.on('dragend', e => {
  let p = e.target.getLatLng();
  pos = [p.lat, p.lng];
});

function calc() {
  let miss = Math.max(0, (goal.value - cur.value) * 1.05);
  distM = Math.round(miss * (str.value / 100));
  info.innerText = `Vaja (+5% varuga): ${Math.round(miss)} sammu (~${(distM/1000).toFixed(2)} km)`;
}

function gps() {
  navigator.geolocation.getCurrentPosition(p => {
    pos = [p.coords.latitude, p.coords.longitude];
    mk.setLatLng(pos); map.setView(pos, 16);
  }, () => alert("GPS ei vastanud, lohista pin kaardil!"));
}

function pt(lat, lon, d, a) {
  let r = a * Math.PI / 180;
  return [lat + (d * Math.cos(r)) / 111320, lon + (d * Math.sin(r)) / (111320 * Math.cos(lat * Math.PI / 180))];
}

async function go() {
  b.innerText = "⏳ Arvutan...";
  try {
    ang = dir.value === 'r' ? (ang + 70) % 360 : Number(dir.value);
    
    // Optimeeritud ringi loogika (hoiab ära tagasipöörded)
    let rad = distM / 5.2; 
    let d;
    
    for (let i = 0; i < 2; i++) {
      // Teeme sujuva 4-punkti ringi (väljaku- või kaarekujuline hajutatus)
      let p1 = pt(pos[0], pos[1], rad * 0.7, ang - 45);
      let p2 = pt(pos[0], pos[1], rad, ang + 45);
      let p3 = pt(pos[0], pos[1], rad * 0.7, ang + 135);
      
      let s = [pos, p1, p2, p3, pos].map(x => `${x[1].toFixed(5)},${x[0].toFixed(5)}`).join(';');
      let r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${s}?overview=full&geometries=geojson`);
      d = await r.json();
      
      if (!d.routes || !d.routes[0]) throw new Error("Teekonda ei leitud");
      let realDist = d.routes[0].distance;
      if (Math.abs(realDist - distM) / distM <= 0.15 || realDist === 0) break;
      rad = rad * (distM / realDist);
    }

    if (layer) map.removeLayer(layer);
    layer = L.geoJSON(d.routes[0].geometry, { style: { color: '#10b981', weight: 6 } }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [25, 25] });

    let steps = Math.round(d.routes[0].distance / (str.value / 100));
    res.innerText = `Ring: +${steps} sammu (${(d.routes[0].distance/1000).toFixed(2)} km)`;
    
    let w = d.waypoints.slice(1, 4).map(x => `${x.location[1]},${x.location[0]}`).join('|');
    gm.href = `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${pos[0]},${pos[1]}&waypoints=${w}&travelmode=walking`;
    bar.style.display = 'block';
  } catch (e) { alert("Viga: " + e.message); }
  b.innerText = "⚡ Joonista ring";
}

calc();
</script>
</body>
</html>
