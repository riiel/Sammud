<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sammuring</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #0f172a; color: #fff; }
  .p { padding: 10px 12px; background: #1e293b; border-bottom: 1px solid #334155; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 7px; }
  input, select, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-weight: 700; width: 100%; font-size: 0.9rem; }
  .btn { background: #10b981; color: #052e16; border: none; cursor: pointer; }
  .btn:disabled { opacity: 0.5; }
  #map { width: 100%; height: 64vh; min-height: 340px; background: #334155; }
  #bar { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #1e293b; padding: 12px; border-radius: 12px; z-index: 999; display: none; border: 1px solid #10b981; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
  .bar-btns { display: flex; gap: 6px; margin-top: 8px; }
  .gm { display: block; text-align: center; background: #3b82f6; color: #fff; padding: 10px 8px; border-radius: 8px; text-decoration: none; font-weight: 700; flex: 1.2; font-size: 0.85rem; }
  .walk-btn { background: #10b981; color: #052e16; border: none; flex: 1.3; cursor: pointer; font-size: 0.85rem; }
  .retry { background: #334155; color: #fff; border: none; flex: 0.9; cursor: pointer; font-size: 0.85rem; }
  .num-icon { background: #0f172a; color: #10b981; border: 2px solid #10b981; border-radius: 50%; font-weight: 800; font-size: 12px; text-align: center; line-height: 20px; }
</style>
</head>
<body>
<div class="p">
  <div class="row">
    <b>👟 Sammuring</b>
    <button onclick="gps()" style="width:auto;background:#334155;">📍 Minu asukoht</button>
  </div>
  <div class="row">
    <input type="number" id="cur" value="7733" oninput="calc()" placeholder="Tehtud">
    <input type="number" id="goal" value="10000" oninput="calc()" placeholder="Eesmärk">
    <input type="number" id="str" value="76" oninput="calc()" style="width:75px" placeholder="cm">
  </div>
  <div class="row" style="font-size:13px;color:#10b981;" id="info">Vaja: 2380 sammu (~1.81 km)</div>
  <div class="row">
    <select id="mode">
      <option value="loop">🔄 Puhas ring</option>
      <option value="outback">↔️ Edasi-tagasi</option>
    </select>
    <select id="dir">
      <option value="r">🎲 Suvaline suund</option>
      <option value="180">⬇️ Lõunasse</option>
      <option value="0">⬆️ Põhja</option>
      <option value="90">➡️ Itta</option>
      <option value="270">⬅️ Läände</option>
    </select>
  </div>
  <button class="btn" id="b" onclick="go()">⚡ Joonista teekond</button>
</div>

<div id="map"></div>
<div id="bar">
  <div id="res" style="font-weight:700;"></div>
  <div id="sub" style="font-size:0.8rem;color:#94a3b8;margin-top:2px;"></div>
  <div class="bar-btns">
    <button class="retry" onclick="nextDir()">🎲 Uus suund</button>
    <button class="walk-btn" id="walkBtn" onclick="toggleWalk()">🧭 Kõnni siin kaardil</button>
    <a id="gm" class="gm" target="_blank">🗺️ Google Maps</a>
  </div>
</div>

<script>
let pos = [61.1715, 25.5415], distM = 1809, ang = 135, layer, extraMks = [];
let watchId = null, liveDot = null, liveCircle = null;
if (localStorage.sr_lat) pos = [Number(localStorage.sr_lat), Number(localStorage.sr_lon)];

const map = L.map('map').setView(pos, 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const mk = L.marker(pos, { draggable: true }).addTo(map)
  .bindPopup("<b>Algus ja lõpp</b><br>Lohista või kliki kaardile!").openPopup();

function setPos(lat, lon) {
  pos = [lat, lon]; mk.setLatLng(pos);
  localStorage.sr_lat = lat; localStorage.sr_lon = lon;
}
map.on('click', e => setPos(e.latlng.lat, e.latlng.lng));
mk.on('dragend', e => { let p = e.target.getLatLng(); setPos(p.lat, p.lng); });

function calc() {
  let miss = Math.max(0, (goal.value - cur.value) * 1.05);
  distM = Math.round(miss * (str.value / 100));
  info.innerText = `Vaja (+5% varuga): ${Math.round(miss)} sammu (~${(distM/1000).toFixed(2)} km)`;
}

function gps() {
  navigator.geolocation.getCurrentPosition(p => {
    setPos(p.coords.latitude, p.coords.longitude);
    map.setView(pos, 16);
  }, () => alert("GPS ei vastanud, kliki kaardile!"));
}

// Reaalajas kõndimise jälgimine otse meie kaardil
function toggleWalk() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (liveDot) map.removeLayer(liveDot);
    if (liveCircle) map.removeLayer(liveCircle);
    walkBtn.innerText = "🧭 Kõnni siin kaardil";
    walkBtn.style.background = "#10b981";
    return;
  }
  if (!navigator.geolocation) return alert("GPS pole toetatud!");
  walkBtn.innerText = "⏹️ Lõpeta jälgimine";
  walkBtn.style.background = "#f59e0b";
  watchId = navigator.geolocation.watchPosition(p => {
    let curPos = [p.coords.latitude, p.coords.longitude];
    if (!liveDot) {
      liveCircle = L.circle(curPos, { radius: p.coords.accuracy || 15, color: '#3b82f6', fillOpacity: 0.15, weight: 1 }).addTo(map);
      liveDot = L.circleMarker(curPos, { radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
    } else {
      liveDot.setLatLng(curPos);
      liveCircle.setLatLng(curPos).setRadius(p.coords.accuracy || 15);
    }
    map.panTo(curPos);
  }, () => alert("Ei saa GPS signaali kätte!"), { enableHighAccuracy: true, maximumAge: 2000 });
}

function pt(lat, lon, d, a) {
  let r = a * Math.PI / 180;
  return [lat + (d * Math.cos(r)) / 111320, lon + (d * Math.sin(r)) / (111320 * Math.cos(lat * Math.PI / 180))];
}

function mDist(a, b) {
  let toR = Math.PI / 180, dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
  return Math.hypot(dLat, dLon * Math.cos((a[0] + b[0]) * 0.5 * toR)) * 6371000;
}

function pathLen(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += mDist(pts[i - 1], pts[i]);
  return s;
}

// Tugevdatud lõikur: eemaldab nii tupikud kui ka väikesed kõrvaltänava jõnksud (kuni 32m laiused paunad)
function cleanSpikes(rawCoords) {
  let pts = [rawCoords[0]];
  for (let i = 1; i < rawCoords.length; i++) {
    let d = mDist(rawCoords[i - 1], rawCoords[i]);
    if (d > 8) {
      let n = Math.ceil(d / 8);
      for (let k = 1; k < n; k++) {
        let f = k / n;
        pts.push([rawCoords[i - 1][0] + (rawCoords[i][0] - rawCoords[i - 1][0]) * f, rawCoords[i - 1][1] + (rawCoords[i][1] - rawCoords[i - 1][1]) * f]);
      }
    }
    pts.push(rawCoords[i]);
  }
  let changed = true, guard = 0;
  while (changed && guard++ < 35) {
    changed = false;
    let cum = [0];
    for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + mDist(pts[i - 1], pts[i]);
    let tot = cum[pts.length - 1];
    for (let i = 0; i < pts.length - 4 && !changed; i++) {
      for (let j = pts.length - 1; j > i + 3; j--) {
        if (cum[i] < 50 && (tot - cum[j]) < 50) continue;
        let sub = cum[j] - cum[i];
        let direct = mDist(pts[i], pts[j]);
        // Kui teekond teeb pauna, mis tuleb samasse kohta (<32m) tagasi, lõikame pauna maha
        if (sub > 25 && sub < tot * 0.55 && direct < 32 && sub > direct * 2.4) {
          pts.splice(i + 1, j - i);
          changed = true; break;
        }
      }
    }
  }
  return pts;
}

// Võtab puhastatud ringilt võrdsete vahemaade tagant N punkti
function sampleByDist(pts, count) {
  let cum = [0];
  for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + mDist(pts[i - 1], pts[i]);
  let tot = cum[cum.length - 1], res = [];
  for (let k = 1; k <= count; k++) {
    let target = (tot * k) / (count + 1);
    let idx = cum.findIndex(c => c >= target);
    if (idx !== -1) res.push(pts[idx]);
  }
  return res;
}

async function askOsrm(pts) {
  let s = pts.map(x => `${x[1].toFixed(5)},${x[0].toFixed(5)}`).join(';');
  let r = await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${s}?overview=full&geometries=geojson`);
  let d = await r.json();
  if (!d.routes || !d.routes[0]) throw new Error("Teekonda ei leitud");
  return d;
}

function nextDir() {
  dir.value = 'r';
  go();
}

async function go() {
  b.disabled = true; b.innerText = "⏳ Otsin parimat teed...";
  if (layer) map.removeLayer(layer);
  extraMks.forEach(m => map.removeLayer(m));
  extraMks = [];

  try {
    ang = dir.value === 'r' ? (ang + 65) % 360 : Number(dir.value);

    if (mode.value === 'outback') {
      let half = (distM / 2) * 0.8, d, turnPt;
      for (let i = 0; i < 2; i++) {
        let target = pt(pos[0], pos[1], half, ang);
        d = await askOsrm([pos, target, pos]);
        turnPt = [d.waypoints[1].location[1], d.waypoints[1].location[0]];
        let realD = d.routes[0].distance;
        if (Math.abs(realD - distM) / distM < 0.1) break;
        half = half * (distM / (realD || distM));
      }
      let coords = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      layer = L.polyline(coords, { color: '#10b981', weight: 6 }).addTo(map);
      let tMk = L.circleMarker(turnPt, { radius: 8, fillColor: '#f59e0b', color: '#fff', weight: 2, fillOpacity: 1 })
        .addTo(map).bindPopup("🔄 <b>Pöördepunkt!</b><br>Keera siin ots ringi.").openPopup();
      extraMks.push(tMk);
      map.fitBounds(layer.getBounds(), { padding: [30, 30] });

      let totalD = d.routes[0].distance;
      let steps = Math.round(totalD / (str.value / 100));
      res.innerText = `Edasi-tagasi: +${steps} sammu (${(totalD/1000).toFixed(2)} km)`;
      sub.innerText = `Pöördepunkt ${(totalD/2000).toFixed(2)} km kaugusel • ~${Math.round(totalD/80)} min`;
      gm.href = `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${pos[0]},${pos[1]}&waypoints=${turnPt[0]},${turnPt[1]}&travelmode=walking`;
    } else {
      let diam = distM / 2.6, clean = [], bestLen = 0;
      for (let attempt = 0; attempt < 4; attempt++) {
        let p1 = pt(pos[0], pos[1], diam * 0.7, ang - 42);
        let p2 = pt(pos[0], pos[1], diam, ang);
        let p3 = pt(pos[0], pos[1], diam * 0.7, ang + 42);
        let d = await askOsrm([pos, p1, p2, p3, pos]);
        let raw = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        clean = cleanSpikes(raw);
        bestLen = pathLen(clean);

        if (bestLen < distM * 0.35) {
          ang = (ang + 75) % 360;
          continue;
        }
        if (Math.abs(bestLen - distM) / distM <= 0.14) break;
        diam = diam * (distM / bestLen);
      }

      layer = L.polyline(clean, { color: '#10b981', weight: 6 }).addTo(map);

      // Lisame kaardile suunanumbrid 1, 2, 3, et näha mis pidi ring jookseb
      sampleByDist(clean, 3).forEach((p, idx) => {
        let ic = L.divIcon({ className: 'num-icon', html: `${idx + 1}`, iconSize: [24, 24] });
        extraMks.push(L.marker(p, { icon: ic }).addTo(map));
      });

      map.fitBounds(layer.getBounds(), { padding: [30, 30] });

      let steps = Math.round(bestLen / (str.value / 100));
      res.innerText = `Puhas ring: +${steps} sammu (${(bestLen/1000).toFixed(2)} km)`;
      sub.innerText = `Järgi numbreid 1 → 2 → 3 • ~${Math.round(bestLen/80)} min kõndi`;

      // Saadame Google Mapsile 7 tihedat vahepunkti, et ta ei saaks teekonda ära lõhkuda
      let wps = sampleByDist(clean, 7).map(p => `${p[0].toFixed(5)},${p[1].toFixed(5)}`).join('|');
      gm.href = `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${pos[0]},${pos[1]}&waypoints=${wps}&travelmode=walking`;
    }
    bar.style.display = 'block';
  } catch (e) { alert("Viga: " + e.message); }
  b.disabled = false; b.innerText = "⚡ Joonista teekond";
}

calc();
</script>
</body>
</html>
